name: fashion_store_app
description: "Fashion Mobile Store App - Final Project PRM393 FPTU"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.13.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Icons mặc định
  cupertino_icons: ^1.0.8

  # 1. Firebase & Authentication
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  google_sign_in: ^6.2.1

  # 2. State Management
  provider: ^6.1.2

  # 3. Bản đồ miễn phí (OpenStreetMap)
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.1

  # 4. Giao diện & Tiện ích
  cached_network_image: ^3.4.1
  intl: ^0.19.0
  flutter_spinkit: ^5.2.1
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true